default_stages: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/.*\.json$  # kept exactly as splatoon2.ink served them
      - id: trailing-whitespace
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-toml
      - id: check-json
      - id: detect-private-key
      - id: check-added-large-files
  - repo: https://github.com/psf/black
    rev: 26.10.1  # PINNED in Poetry
    hooks:
      - id: black
  - repo: https://github.com/python-poetry/poetry
    rev: 2.5.1  # PINNED in Poetry
    hooks:
      - id: poetry-check

  # A TODO or FIXME names its GitHub issue, as TODO(#123). Markdown and this
  # file use the words without being sentinels.
  - repo: local
    hooks:
      - id: todo-needs-issue
        name: TODO and FIXME name an issue, as TODO(#N)
        language: pygrep
        entry: '\b(TODO|FIXME)\b(?!\(#\d+\))'
        exclude_types: [markdown]
        exclude: '^\.pre-commit-config\.yaml$'
